<VirtualHost 127.0.0.1:443 10.1.1.1:443>
        ServerName 127.0.0.1
        ServerAlias 10.1.1.1 localhost

        DocumentRoot /var/www/html

	SSLEngine on
	SSLCertificateFile /etc/ssl/certs/jsbach.crt
	SSLCertificateKeyFile /etc/ssl/private/jsbach.key
	SSLProtocol all -SSLv3 -TLSv1 -TLSv1.1

        ScriptAlias /cgi-bin/ /usr/local/JSBach/cgi-bin/

        <Directory "/usr/local/JSBach/cgi-bin">
                Require all denied
        </Directory>

        <Directory "/usr/local/JSBach/cgi-bin">
                AllowOverride None
                Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
                AddHandler cgi-script .cgi

                AuthType Basic
                AuthName "Acces JSBach"
                AuthUserFile /usr/local/JSBach/conf/.htpasswd
                Require valid-user
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log
        CustomLog ${APACHE_LOG_DIR}/access.log combined
  </VirtualHost>
